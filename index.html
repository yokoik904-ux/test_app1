
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Sandbox</title>

<style>
body {
    background-color: #121212;
    color: #ff3333;
    font-family: "Courier New", monospace;
    padding: 2rem;
    line-height: 1.6;
}

p {
    margin: 25px 0;
    font-size: 20px;
}

.cursor {
    display: inline-block;
    width: 12px;
    height: 1.2em;
    background: #ff3333;
    vertical-align: bottom;
    animation: blink 1s step-end infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<p>&gt; git init</p>

<p>&gt; git add index.html</p>

<p>&gt; git commit -m "initial commit"</p>

<p>&gt; git push origin main</p>

<p>&gt; Deployment successful.</p>

<p>&gt; USER: KAREN</p>

<p>&gt; STATUS: CONNECTED<span class="cursor"></span></p>

</body>
</html>
